[package]
name = "rumor-simulation"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rumor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
rand = "0.8"
rayon = "1.10"
runvault = { git = "https://github.com/akitenkrad/rs-runvault", branch = "main" }
runvault-socsim = { git = "https://github.com/akitenkrad/rs-runvault-socsim", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socsim-core = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", rev = "5d14c3d", package = "socsim-core" }
socsim-engine = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", rev = "5d14c3d", package = "socsim-engine" }
socsim-net = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", rev = "5d14c3d", package = "socsim-net" }
toml = "0.8"
